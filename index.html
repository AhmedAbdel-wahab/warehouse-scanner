
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Warehouse Scanner</title>

  <!-- ZXing -->
  <script
    type="text/javascript"
    src="https://unpkg.com/@zxing/browser@latest">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      background: #111827;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;
    }


    .container {

      width: 100%;

      max-width: 700px;

      margin: auto;
    }


    h1 {

      margin-bottom: 5px;
    }


    .subtitle {

      color: #cbd5e1;

      margin-bottom: 15px;
    }


    .status {

      background: #1f2937;

      border-radius: 12px;

      padding: 14px;

      margin: 15px 0;

      white-space: pre-line;

      font-size: 16px;
    }


    .status.success {

      border: 2px solid #22c55e;

      color: #86efac;
    }


    .status.error {

      border: 2px solid #ef4444;

      color: #fca5a5;
    }


    .camera-box {

      position: relative;

      width: 100%;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      margin: 15px auto;
    }


    video {

      width: 100%;

      height: auto;

      min-height: 300px;

      display: block;

      background: #000;

      object-fit: cover;
    }


    /*
      مربع إرشادي للباركود
    */

    .scan-frame {

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 75%;

      height: 130px;

      border: 3px solid white;

      border-radius: 12px;

      pointer-events: none;
    }


    button {

      border: 0;

      border-radius: 10px;

      padding: 14px 22px;

      font-size: 17px;

      cursor: pointer;

      margin: 5px;
    }


    #startBtn {

      background: #16a34a;

      color: white;
    }


    #stopBtn {

      background: #dc2626;

      color: white;
    }


    button:active {

      transform: scale(0.97);
    }


    .result {

      background: #0f172a;

      border: 2px solid #334155;

      border-radius: 12px;

      padding: 18px;

      margin-top: 15px;

      font-size: 22px;

      word-break: break-all;
    }


    .result.success {

      border-color: #22c55e;

      color: #86efac;
    }


    .info {

      margin-top: 20px;

      padding: 12px;

      background: #1e293b;

      border-radius: 10px;

      color: #cbd5e1;

      font-size: 14px;

      line-height: 1.7;
    }


    .camera-info {

      margin-top: 10px;

      color: #94a3b8;

      font-size: 13px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 Warehouse Scanner
  </h1>


  <div class="subtitle">
    امسح Barcode أو QR Code
  </div>


  <div
    id="status"
    class="status"
  >
    اضغط "تشغيل الكاميرا" للبدء.
  </div>


  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>


    <div class="scan-frame"></div>

  </div>


  <div
    id="cameraInfo"
    class="camera-info"
  >
  </div>


  <div>

    <button id="startBtn">
      📷 تشغيل الكاميرا
    </button>


    <button id="stopBtn">
      ⛔ إيقاف
    </button>

  </div>


  <div
    id="result"
    class="result"
  >
    لم يتم قراءة Barcode بعد
  </div>


  <div class="info">

    وجّه الباركود داخل المربع الأبيض.

    <br>

    حاول أن يكون الباركود واضحًا وكبيرًا في الصورة.

    <br>

    اترك مسافة تقريبًا 10–30 سم بين الكاميرا والباركود.

  </div>


</div>


<script>


let codeReader = null;

let scanning = false;


const video =
  document.getElementById("video");


const statusBox =
  document.getElementById("status");


const resultBox =
  document.getElementById("result");


const cameraInfo =
  document.getElementById("cameraInfo");



function setStatus(
  message,
  type = ""
) {

  statusBox.textContent = message;

  statusBox.className = "status";


  if (type === "success") {

    statusBox.classList.add("success");

  }


  if (type === "error") {

    statusBox.classList.add("error");

  }

}



/*
  تشغيل الكاميرا
*/

async function startCamera() {

  try {


    stopCamera();


    resultBox.textContent =
      "جاري البحث عن Barcode...";


    resultBox.className =
      "result";


    setStatus(
      "جاري تشغيل الكاميرا..."
    );


    /*
      التأكد من HTTPS
    */

    if (!window.isSecureContext) {

      throw new Error(
        "الصفحة ليست HTTPS."
      );

    }


    /*
      التأكد من وجود ZXing
    */

    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "ZXingBrowser غير موجود.\n" +
        "تأكد أن مكتبة ZXing تم تحميلها."
      );

    }


    /*
      إنشاء قارئ متعدد الصيغ
    */

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    scanning = true;


    setStatus(
      "📷 الكاميرا تعمل.\n" +
      "وجّه الباركود داخل المربع الأبيض."
    );


    /*
      تشغيل الكاميرا والقراءة
    */

    await codeReader.decodeFromConstraints(

      {

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30
          }

        },

        audio: false

      },


      video,


      (
        result,
        error,
        controls
      ) => {


        /*
          لو تم العثور على Barcode
        */

        if (result) {

          const value =
            result.getText();


          if (value) {

            handleBarcode(value);

          }

        }

      }

    );


    /*
      معلومات الكاميرا
    */

    setTimeout(
      showCameraInfo,
      1000
    );


  }

  catch (error) {

    console.error(
      "Scanner Error:",
      error
    );


    let message =
      "❌ فشل تشغيل الكاميرا.";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ تم رفض إذن الكاميرا.\n" +
        "اسمح للكاميرا لهذا الموقع من إعدادات Edge.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ لم يتم العثور على كاميرا.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ الكاميرا مستخدمة بواسطة برنامج آخر.";

    }


    else if (error.message) {

      message +=
        "\n" +
        error.message;

    }


    scanning = false;


    setStatus(
      message,
      "error"
    );

  }

}



/*
  عرض معلومات الكاميرا
*/

function showCameraInfo() {

  try {

    if (
      video.videoWidth &&
      video.videoHeight
    ) {

      cameraInfo.textContent =
        "دقة الكاميرا: " +
        video.videoWidth +
        " × " +
        video.videoHeight;

    }

  }

  catch (e) {

    console.log(e);

  }

}



/*
  تم العثور على Barcode
*/

function handleBarcode(value) {


  if (!value) {

    return;

  }


  if (!scanning) {

    return;

  }


  scanning = false;


  console.log(
    "BARCODE FOUND:",
    value
  );


  resultBox.textContent =
    "✅ Barcode: " + value;


  resultBox.className =
    "result success";


  setStatus(
    "✅ تم قراءة Barcode بنجاح!",
    "success"
  );


  /*
    نسخ الكود للحافظة
  */

  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(value)
      .catch(() => {});

  }


  /*
    إيقاف الكاميرا
  */

  setTimeout(
    stopCamera,
    300
  );

}



/*
  إيقاف الكاميرا
*/

function stopCamera() {


  scanning = false;


  if (codeReader) {

    try {

      codeReader.reset();

    }

    catch (e) {

      console.log(
        "Reset error:",
        e
      );

    }

  }


  codeReader = null;


  /*
    إيقاف الفيديو
  */

  if (video.srcObject) {

    const tracks =
      video.srcObject.getTracks();


    tracks.forEach(
      track => track.stop()
    );


    video.srcObject = null;

  }


  cameraInfo.textContent =
    "";

}



/*
  زر التشغيل
*/

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startCamera
  );



/*
  زر الإيقاف
*/

document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    () => {

      stopCamera();


      setStatus(
        "تم إيقاف الكاميرا."
      );

    }
  );



/*
  تنظيف عند إغلاق الصفحة
*/

window.addEventListener(
  "beforeunload",
  () => {

    stopCamera();

  }
);


</script>


</body>

</html>
