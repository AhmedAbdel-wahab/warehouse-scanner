<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Warehouse Barcode Scanner</title>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 15px;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    h2 {

      margin: 5px 0 15px;

    }


    /* =========================
       CAMERA
       ========================= */

    #cameraBox {

      position: relative;

      width: 100%;

      max-width: 900px;

      margin: auto;

      background: #000;

      overflow: hidden;

      border-radius: 12px;

    }


    #video {

      width: 100%;

      height: auto;

      display: block;

      /*
       * الوضع الطبيعي افتراضيًا
       */

      transform: scaleX(1);

    }


    /*
     * عندما يتم تفعيل Mirror
     */

    #video.mirrored {

      transform: scaleX(-1);

    }


    /* =========================
       SCAN FRAME
       ========================= */

    #scanFrame {

      position: absolute;

      left: 10%;

      right: 10%;

      top: 25%;

      height: 50%;

      border: 3px solid #00ff66;

      border-radius: 10px;

      pointer-events: none;

    }


    #scanLine {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: red;

      box-shadow: 0 0 8px red;

      animation: scanMove 2s infinite;

    }


    @keyframes scanMove {

      0% {

        top: 10%;

      }

      50% {

        top: 90%;

      }

      100% {

        top: 10%;

      }

    }


    /* =========================
       INFO
       ========================= */

    .info {

      max-width: 900px;

      margin: 12px auto;

      padding: 12px;

      background: #222;

      border-radius: 10px;

      text-align: right;

    }


    #status {

      font-size: 18px;

      font-weight: bold;

    }


    #result {

      margin-top: 10px;

      padding: 12px;

      background: #000;

      border-radius: 8px;

      font-size: 20px;

      direction: ltr;

      text-align: center;

      word-break: break-all;

    }


    #cameraInfo {

      margin-top: 10px;

    }


    #debug {

      margin-top: 10px;

      color: #aaa;

      font-size: 13px;

      direction: ltr;

      text-align: left;

      white-space: pre-wrap;

      word-break: break-word;

    }


    /* =========================
       BUTTONS
       ========================= */

    .buttons {

      max-width: 900px;

      margin: 10px auto;

    }


    button {

      border: none;

      border-radius: 8px;

      padding: 12px 18px;

      margin: 5px;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;

    }


    button:hover {

      opacity: 0.85;

    }


    #startBtn {

      background: #0a7cff;

      color: white;

    }


    #stopBtn {

      background: #d33;

      color: white;

    }


    #captureBtn {

      background: #16a34a;

      color: white;

    }


    #fileBtn {

      background: #9333ea;

      color: white;

    }


    #mirrorBtn {

      background: #f59e0b;

      color: white;

    }


    #normalBtn {

      background: #475569;

      color: white;

    }


    #fileInput {

      display: none;

    }


    /* =========================
       CAPTURED IMAGE
       ========================= */

    #testImage {

      display: none;

      width: 100%;

      max-width: 900px;

      margin: 15px auto;

      border-radius: 10px;

      border: 2px solid #555;

    }


    canvas {

      display: none;

    }


    .small {

      color: #aaa;

      font-size: 13px;

      margin-top: 8px;

    }


    .mode {

      display: inline-block;

      margin-top: 8px;

      padding: 6px 12px;

      border-radius: 20px;

      background: #333;

      color: #fff;

      font-size: 13px;

    }

  </style>

</head>


<body>


  <h2>
    📷 Barcode Scanner
  </h2>


  <!-- =========================
       CAMERA
       ========================= -->

  <div id="cameraBox">


    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>


    <div id="scanFrame">

      <div id="scanLine"></div>

    </div>


  </div>


  <!-- =========================
       INFORMATION
       ========================= -->

  <div class="info">


    <div id="status">

      ⏳ جاري تشغيل الكاميرا...

    </div>


    <div class="small">

      وجّه الـBarcode داخل الإطار الأخضر

    </div>


    <div
      id="mode"
      class="mode">

      📷 الوضع الطبيعي

    </div>


    <div id="result">

      لا يوجد Barcode

    </div>


    <div
      id="cameraInfo"
      class="small">

      -

    </div>


    <div id="debug">

      -

    </div>


  </div>


  <!-- =========================
       BUTTONS
       ========================= -->

  <div class="buttons">


    <button id="startBtn">

      ▶ تشغيل الكاميرا

    </button>


    <button id="stopBtn">

      ⏹ إيقاف

    </button>


    <button id="mirrorBtn">

      🪞 عكس الكاميرا

    </button>


    <button id="normalBtn">

      📷 عادي

    </button>


    <button id="captureBtn">

      📸 التقاط وفحص

    </button>


    <button id="fileBtn">

      🖼️ فحص صورة Barcode

    </button>


    <input
      id="fileInput"
      type="file"
      accept="image/*">


  </div>


  <!-- الصورة الملتقطة -->

  <img
    id="testImage"
    alt="Barcode image">


  <canvas
    id="canvas">
  </canvas>


  <script>


    /* =====================================================
       VARIABLES
       ===================================================== */

    let codeReader = null;

    let controls = null;

    let video = null;

    let canvas = null;

    let scanning = false;

    let isMirrored = false;


    const statusEl =
      document.getElementById("status");


    const resultEl =
      document.getElementById("result");


    const cameraInfoEl =
      document.getElementById("cameraInfo");


    const debugEl =
      document.getElementById("debug");


    const modeEl =
      document.getElementById("mode");


    const testImage =
      document.getElementById("testImage");


    const fileInput =
      document.getElementById("fileInput");


    video =
      document.getElementById("video");


    canvas =
      document.getElementById("canvas");


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(text) {

      statusEl.textContent = text;

    }


    function setDebug(text) {

      debugEl.textContent = text;

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(text) {

      return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       SHOW RESULT
       ===================================================== */

    function showResult(
      value,
      format
    ) {


      resultEl.innerHTML =

        "✅ <b>" +

        escapeHtml(value) +

        "</b>" +

        (

          format

            ?

            "<br><small>Format: " +

            escapeHtml(
              String(format)
            ) +

            "</small>"

            :

            ""

        );


    }


    /* =====================================================
       MIRROR CONTROL
       ===================================================== */

    function updateMirror() {


      if (isMirrored) {

        video.classList.add(
          "mirrored"
        );


        modeEl.textContent =
          "🪞 الصورة معكوسة";


      } else {

        video.classList.remove(
          "mirrored"
        );


        modeEl.textContent =
          "📷 الوضع الطبيعي";

      }

    }


    function mirrorCamera() {

      isMirrored =
        !isMirrored;


      updateMirror();

    }


    function normalCamera() {

      isMirrored =
        false;


      updateMirror();

    }


    /* =====================================================
       START CAMERA
       ===================================================== */

    async function startCamera() {


      try {


        stopCamera(false);


        setStatus(
          "⏳ جاري تشغيل الكاميرا..."
        );


        resultEl.textContent =
          "لا يوجد Barcode";


        setDebug(
          "Loading ZXing..."
        );


        if (
          typeof ZXingBrowser ===
          "undefined"
        ) {


          throw new Error(

            "ZXingBrowser غير موجود."

          );

        }


        codeReader =

          new ZXingBrowser
            .BrowserMultiFormatReader();


        /*
         * إعدادات الكاميرا
         */

        const constraints = {


          video: {


            /*
             * نحاول استخدام الكاميرا الخلفية
             * إن كانت متاحة
             */

            facingMode: {

              ideal: "environment"

            },


            width: {

              ideal: 1920,

              min: 640

            },


            height: {

              ideal: 1080,

              min: 480

            },


            frameRate: {

              ideal: 30,

              min: 15

            }

          },


          audio: false

        };


        /*
         * تشغيل ZXing
         */

        controls =

          await codeReader
            .decodeFromConstraints(

              constraints,

              video,

              (result, error) => {


                /*
                 * تم العثور على Barcode
                 */

                if (result) {


                  const value =
                    result.getText();


                  let format = "";


                  try {


                    format =

                      result

                        .getBarcodeFormat()

                        .toString();


                  } catch (e) {}


                  /*
                   * عرض النتيجة
                   */

                  showResult(
                    value,
                    format
                  );


                  setStatus(
                    "✅ تم اكتشاف Barcode!"
                  );


                  setDebug(

                    "LIVE CAMERA SUCCESS\n\n" +

                    "Value: " +

                    value +

                    "\n\nFormat: " +

                    format

                  );


                  /*
                   * إرسال Barcode للصفحة
                   * الرئيسية لو موجودة
                   */

                  try {


                    window.parent
                      .postMessage(

                        {

                          type:
                            "barcode",

                          barcode:
                            value

                        },

                        "*"

                      );


                  } catch (e) {}


                }

              }

            );


        scanning = true;


        setStatus(
          "📷 الكاميرا تعمل. Scanning..."
        );


        /*
         * قراءة معلومات الكاميرا
         */

        setTimeout(() => {


          try {


            const stream =
              video.srcObject;


            if (

              stream &&

              stream
                .getVideoTracks()
                .length

            ) {


              const track =
                stream
                  .getVideoTracks()[0];


              const settings =
                track.getSettings();


              cameraInfoEl.textContent =

                "الكاميرا: " +

                (

                  track.label ||

                  "Unknown"

                ) +

                " | الدقة: " +

                (

                  settings.width ||

                  "?"

                ) +

                " × " +

                (

                  settings.height ||

                  "?"

                );


              setDebug(

                "Scanning...\n\n" +

                "Camera: " +

                (

                  track.label ||

                  "Unknown"

                ) +

                "\nResolution: " +

                (

                  settings.width ||

                  "?"

                ) +

                " x " +

                (

                  settings.height ||

                  "?"

                ) +

                "\nFacing: " +

                (

                  settings.facingMode ||

                  "unknown"

                ) +

                "\nFocus Mode: " +

                (

                  settings.focusMode ||

                  "not reported"

                ) +

                "\nZoom: " +

                (

                  settings.zoom ||

                  "not reported"

                )

              );

            }


          } catch (e) {


            console.log(e);


          }


        }, 1000);


      } catch (error) {


        console.error(error);


        scanning = false;


        setStatus(
          "❌ فشل تشغيل الكاميرا"
        );


        setDebug(

          "ERROR:\n" +

          (

            error.message ||

            error

          )

        );


      }


    }


    /* =====================================================
       CAPTURE CAMERA IMAGE
       ===================================================== */

    function captureAndDecode() {


      try {


        if (
          video.readyState < 2
        ) {


          setStatus(
            "❌ الكاميرا غير جاهزة."
          );


          return;

        }


        const width =
          video.videoWidth;


        const height =
          video.videoHeight;


        if (
          !width ||
          !height
        ) {


          setStatus(
            "❌ لا توجد صورة من الكاميرا."
          );


          return;

        }


        /*
         * Canvas يأخذ الصورة الأصلية
         * وليس الصورة المعكوسة
         */

        canvas.width =
          width;


        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.drawImage(

          video,

          0,

          0,

          width,

          height

        );


        const dataUrl =
          canvas.toDataURL(
            "image/png"
          );


        /*
         * عرض الصورة
         */

        testImage.src =
          dataUrl;


        testImage.style.display =
          "block";


        /*
         * إنشاء Image للفحص
         */

        const img =
          new Image();


        img.onload =
          async function() {


            await decodeImage(

              img,

              "Camera Capture"

            );


          };


        img.src =
          dataUrl;


      } catch (error) {


        setStatus(
          "❌ خطأ في التقاط الصورة"
        );


        setDebug(

          error.message ||

          String(error)

        );


      }

    }


    /* =====================================================
       DECODE IMAGE
       ===================================================== */

    async function decodeImage(

      imageSource,

      sourceName

    ) {


      try {


        setStatus(
          "🔎 جاري فحص الصورة..."
        );


        setDebug(

          "Decoding image...\n\n" +

          "Source: " +

          sourceName

        );


        const reader =

          new ZXingBrowser
            .BrowserMultiFormatReader();


        const result =

          await reader
            .decodeFromImageElement(

              imageSource

            );


        if (!result) {


          throw new Error(
            "No result"
          );

        }


        const value =
          result.getText();


        let format = "";


        try {


          format =

            result

              .getBarcodeFormat()

              .toString();


        } catch (e) {}


        showResult(
          value,
          format
        );


        setStatus(
          "✅ تم اكتشاف Barcode!"
        );


        setDebug(

          "IMAGE DECODE SUCCESS\n\n" +

          "Value: " +

          value +

          "\n\nFormat: " +

          format

        );


        /*
         * إرسال النتيجة للصفحة الرئيسية
         */

        try {


          window.parent
            .postMessage(

              {

                type:
                  "barcode",

                barcode:
                  value

              },

              "*"

            );


        } catch (e) {}


        return true;


      } catch (error) {


        console.error(error);


        setStatus(
          "❌ لم يتم التعرف على Barcode"
        );


        setDebug(

          "IMAGE DECODE FAILED\n\n" +

          (

            error.message ||

            error

          )

        );


        return false;

      }

    }


    /* =====================================================
       FILE IMAGE
       ===================================================== */

    document

      .getElementById("fileBtn")

      .addEventListener(

        "click",

        () => {

          fileInput.click();

        }

      );


    fileInput

      .addEventListener(

        "change",

        () => {


          const file =
            fileInput.files[0];


          if (!file) {

            return;

          }


          const url =
            URL.createObjectURL(
              file
            );


          testImage.src =
            url;


          testImage.style.display =
            "block";


          const img =
            new Image();


          img.onload =
            async function() {


              await decodeImage(

                img,

                "Selected File"

              );


              URL.revokeObjectURL(
                url
              );


            };


          img.onerror =
            function() {


              setStatus(
                "❌ فشل تحميل الصورة."
              );


            };


          img.src =
            url;


        }

      );


    /* =====================================================
       STOP CAMERA
       ===================================================== */

    function stopCamera(
      showMessage = true
    ) {


      scanning = false;


      try {


        if (controls) {


          controls.stop();


          controls = null;


        }


      } catch (e) {}


      try {


        if (codeReader) {


          codeReader.reset();


        }


      } catch (e) {}


      try {


        if (video.srcObject) {


          video.srcObject

            .getTracks()

            .forEach(

              track =>
                track.stop()

            );


          video.srcObject =
            null;


        }


      } catch (e) {}


      if (showMessage) {


        setStatus(
          "⏹ الكاميرا متوقفة"
        );


      }


    }


    /* =====================================================
       BUTTON EVENTS
       ===================================================== */

    document

      .getElementById("startBtn")

      .addEventListener(

        "click",

        startCamera

      );


    document

      .getElementById("stopBtn")

      .addEventListener(

        "click",

        () => {

          stopCamera(true);

        }

      );


    document

      .getElementById("mirrorBtn")

      .addEventListener(

        "click",

        mirrorCamera

      );


    document

      .getElementById("normalBtn")

      .addEventListener(

        "click",

        normalCamera

      );


    document

      .getElementById("captureBtn")

      .addEventListener(

        "click",

        captureAndDecode

      );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    updateMirror();


    window.addEventListener(

      "load",

      () => {


        setTimeout(

          startCamera,

          500

        );


      }

    );


  </script>


</body>

</html>
