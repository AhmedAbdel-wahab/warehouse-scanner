<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Warehouse Barcode Scanner</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  background: #111;
  color: white;

  font-family: Arial, sans-serif;

  text-align: center;
}

h2 {
  margin: 5px 0 15px;
}


/* ================= CAMERA ================= */

#cameraBox {

  position: relative;

  width: 100%;
  max-width: 900px;

  margin: auto;

  background: black;

  overflow: hidden;

  border-radius: 12px;
}

#video {

  width: 100%;
  height: auto;

  display: block;

  transform: scaleX(1);
}

#video.mirrored {

  transform: scaleX(-1);
}


/* ================= SCAN FRAME ================= */

#scanFrame {

  position: absolute;

  left: 8%;
  right: 8%;

  top: 25%;

  height: 50%;

  border: 3px solid #00ff66;

  border-radius: 10px;

  pointer-events: none;
}

#scanLine {

  position: absolute;

  left: 0;
  right: 0;

  top: 50%;

  height: 2px;

  background: red;

  box-shadow: 0 0 8px red;

  animation: scanMove 2s infinite;
}

@keyframes scanMove {

  0% {
    top: 10%;
  }

  50% {
    top: 90%;
  }

  100% {
    top: 10%;
  }

}


/* ================= INFO ================= */

.info {

  max-width: 900px;

  margin: 12px auto;

  padding: 12px;

  background: #222;

  border-radius: 10px;

  text-align: right;
}

#status {

  font-size: 18px;

  font-weight: bold;
}

#result {

  margin-top: 10px;

  padding: 12px;

  background: #000;

  border-radius: 8px;

  font-size: 20px;

  direction: ltr;

  text-align: center;

  word-break: break-all;
}

#cameraInfo {

  margin-top: 10px;

  color: #aaa;

  font-size: 13px;
}

#debug {

  margin-top: 10px;

  color: #aaa;

  font-size: 13px;

  direction: ltr;

  text-align: left;

  white-space: pre-wrap;

  word-break: break-word;
}

.mode {

  display: inline-block;

  margin-top: 8px;

  padding: 6px 12px;

  border-radius: 20px;

  background: #333;

  font-size: 13px;
}


/* ================= BUTTONS ================= */

.buttons {

  max-width: 900px;

  margin: 10px auto;
}

button {

  border: none;

  border-radius: 8px;

  padding: 12px 18px;

  margin: 5px;

  font-size: 16px;

  cursor: pointer;
}

button:hover {

  opacity: 0.85;
}

#startBtn {

  background: #0a7cff;

  color: white;
}

#stopBtn {

  background: #d33;

  color: white;
}

#mirrorBtn {

  background: #f59e0b;

  color: white;
}

#normalBtn {

  background: #475569;

  color: white;
}

#captureBtn {

  background: #16a34a;

  color: white;
}

#fileBtn {

  background: #9333ea;

  color: white;
}

#fileInput {

  display: none;
}


/* ================= IMAGE ================= */

#testImage {

  display: none;

  width: 100%;

  max-width: 900px;

  margin: 15px auto;

  border-radius: 10px;

  border: 2px solid #555;
}

canvas {

  display: none;
}

</style>

</head>


<body>


<h2>
📷 Barcode Scanner
</h2>


<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanFrame">

    <div id="scanLine"></div>

  </div>

</div>


<div class="info">


  <div id="status">

    ⏳ جاري تشغيل الكاميرا...

  </div>


  <div class="mode" id="mode">

    📷 الوضع الطبيعي

  </div>


  <div id="result">

    لا يوجد Barcode

  </div>


  <div id="cameraInfo">

    -

  </div>


  <div id="debug">

    -

  </div>


</div>


<div class="buttons">


  <button id="startBtn">

    ▶ تشغيل الكاميرا

  </button>


  <button id="stopBtn">

    ⏹ إيقاف

  </button>


  <button id="mirrorBtn">

    🪞 عكس الكاميرا

  </button>


  <button id="normalBtn">

    📷 عادي

  </button>


  <button id="captureBtn">

    📸 تحسين وفحص

  </button>


  <button id="fileBtn">

    🖼️ فحص صورة Barcode

  </button>


  <input
    id="fileInput"
    type="file"
    accept="image/*">


</div>


<img
  id="testImage"
  alt="Processed Barcode">


<canvas id="canvas"></canvas>


<script>


/* =====================================================
   VARIABLES
   ===================================================== */

let codeReader = null;

let controls = null;

let video = null;

let canvas = null;

let scanning = false;

let isMirrored = false;


const statusEl =
  document.getElementById("status");

const resultEl =
  document.getElementById("result");

const cameraInfoEl =
  document.getElementById("cameraInfo");

const debugEl =
  document.getElementById("debug");

const modeEl =
  document.getElementById("mode");

const testImage =
  document.getElementById("testImage");

const fileInput =
  document.getElementById("fileInput");


video =
  document.getElementById("video");

canvas =
  document.getElementById("canvas");


/* =====================================================
   HELPERS
   ===================================================== */

function setStatus(text) {

  statusEl.textContent = text;

}


function setDebug(text) {

  debugEl.textContent = text;

}


function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


function showResult(value, format) {

  resultEl.innerHTML =

    "✅ <b>" +

    escapeHtml(value) +

    "</b>" +

    (

      format

      ?

      "<br><small>Format: " +

      escapeHtml(String(format)) +

      "</small>"

      :

      ""

    );

}


/* =====================================================
   MIRROR
   ===================================================== */

function updateMirror() {

  if (isMirrored) {

    video.classList.add("mirrored");

    modeEl.textContent =
      "🪞 الصورة معكوسة";

  }

  else {

    video.classList.remove("mirrored");

    modeEl.textContent =
      "📷 الوضع الطبيعي";

  }

}


function mirrorCamera() {

  isMirrored =
    !isMirrored;

  updateMirror();

}


function normalCamera() {

  isMirrored =
    false;

  updateMirror();

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startCamera() {


  try {


    stopCamera(false);


    setStatus(
      "⏳ جاري تشغيل الكاميرا..."
    );


    setDebug(
      "Loading ZXing..."
    );


    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "ZXingBrowser غير موجود."
      );

    }


    codeReader =

      new ZXingBrowser
        .BrowserMultiFormatReader();


    const constraints = {

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920,
          min: 640
        },

        height: {
          ideal: 1080,
          min: 480
        },

        frameRate: {
          ideal: 30,
          min: 15
        }

      },

      audio: false

    };


    controls =

      await codeReader
        .decodeFromConstraints(

          constraints,

          video,

          (result, error) => {


            if (result) {


              const value =
                result.getText();


              let format = "";


              try {

                format =

                  result
                    .getBarcodeFormat()
                    .toString();

              }

              catch (e) {}


              showResult(
                value,
                format
              );


              setStatus(
                "✅ تم اكتشاف Barcode!"
              );


              setDebug(

                "LIVE CAMERA SUCCESS\n\n" +

                "Value: " +
                value +

                "\nFormat: " +
                format

              );


              try {

                window.parent
                  .postMessage(

                    {
                      type: "barcode",
                      barcode: value
                    },

                    "*"

                  );

              }

              catch (e) {}


            }

          }

        );


    scanning = true;


    setStatus(
      "📷 الكاميرا تعمل. Scanning..."
    );


    setTimeout(() => {


      try {


        const stream =
          video.srcObject;


        if (
          stream &&
          stream.getVideoTracks().length
        ) {


          const track =
            stream.getVideoTracks()[0];


          const settings =
            track.getSettings();


          cameraInfoEl.textContent =

            "الكاميرا: " +

            (
              track.label ||
              "Unknown"
            ) +

            " | الدقة: " +

            (
              settings.width ||
              "?"
            ) +

            " × " +

            (
              settings.height ||
              "?"
            );


          setDebug(

            "Scanning...\n\n" +

            "Camera: " +

            (
              track.label ||
              "Unknown"
            ) +

            "\nResolution: " +

            (
              settings.width ||
              "?"
            ) +

            " x " +

            (
              settings.height ||
              "?"
            ) +

            "\nFocus: " +

            (
              settings.focusMode ||
              "not reported"
            ) +

            "\nZoom: " +

            (
              settings.zoom ||
              "not reported"
            )

          );

        }


      }

      catch (e) {

        console.log(e);

      }


    }, 1000);


  }


  catch (error) {


    console.error(error);


    scanning = false;


    setStatus(
      "❌ فشل تشغيل الكاميرا"
    );


    setDebug(

      "ERROR:\n" +

      (
        error.message ||
        error
      )

    );


  }

}


/* =====================================================
   IMAGE PROCESSING
   ===================================================== */


/*
 * 1) تكبير الصورة
 */

function createUpscaledImage(
  sourceCanvas,
  scale
) {


  const newCanvas =
    document.createElement("canvas");


  newCanvas.width =
    sourceCanvas.width * scale;


  newCanvas.height =
    sourceCanvas.height * scale;


  const ctx =
    newCanvas.getContext("2d");


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    sourceCanvas,

    0,
    0,

    newCanvas.width,
    newCanvas.height

  );


  return newCanvas;

}


/*
 * 2) Grayscale + Contrast
 */

function createEnhancedImage(
  sourceCanvas
) {


  const c =
    document.createElement("canvas");


  c.width =
    sourceCanvas.width;


  c.height =
    sourceCanvas.height;


  const ctx =
    c.getContext("2d");


  ctx.drawImage(
    sourceCanvas,
    0,
    0
  );


  const imageData =
    ctx.getImageData(

      0,
      0,
      c.width,
      c.height

    );


  const data =
    imageData.data;


  const contrast = 1.7;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const r =
      data[i];

    const g =
      data[i + 1];

    const b =
      data[i + 2];


    /*
     * Grayscale
     */

    let gray =

      0.299 * r +

      0.587 * g +

      0.114 * b;


    /*
     * Contrast
     */

    gray =

      ((gray - 128) *
        contrast) + 128;


    gray =

      Math.max(
        0,
        Math.min(
          255,
          gray
        )
      );


    data[i] =
      gray;

    data[i + 1] =
      gray;

    data[i + 2] =
      gray;


  }


  ctx.putImageData(
    imageData,
    0,
    0
  );


  return c;

}


/*
 * 3) Threshold
 */

function createThresholdImage(
  sourceCanvas
) {


  const c =
    document.createElement("canvas");


  c.width =
    sourceCanvas.width;


  c.height =
    sourceCanvas.height;


  const ctx =
    c.getContext("2d");


  ctx.drawImage(
    sourceCanvas,
    0,
    0
  );


  const imageData =
    ctx.getImageData(

      0,
      0,
      c.width,
      c.height

    );


  const data =
    imageData.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const gray =

      0.299 * data[i] +

      0.587 * data[i + 1] +

      0.114 * data[i + 2];


    const value =
      gray > 145
      ? 255
      : 0;


    data[i] =
      value;

    data[i + 1] =
      value;

    data[i + 2] =
      value;

  }


  ctx.putImageData(
    imageData,
    0,
    0
  );


  return c;

}


/* =====================================================
   TRY ZXING
   ===================================================== */

async function tryDecodeCanvas(
  sourceCanvas,
  name
) {


  try {


    const dataUrl =
      sourceCanvas.toDataURL(
        "image/png"
      );


    const img =
      new Image();


    return new Promise(
      resolve => {


        img.onload =
          async function() {


            try {


              const reader =

                new ZXingBrowser
                  .BrowserMultiFormatReader();


              const result =

                await reader
                  .decodeFromImageElement(
                    img
                  );


              if (result) {


                const value =
                  result.getText();


                let format = "";


                try {

                  format =

                    result
                      .getBarcodeFormat()
                      .toString();

                }

                catch (e) {}


                showResult(
                  value,
                  format
                );


                setStatus(
                  "✅ تم اكتشاف Barcode!"
                );


                setDebug(

                  "SUCCESS\n\n" +

                  "Method: " +
                  name +

                  "\n\nValue: " +
                  value +

                  "\nFormat: " +
                  format

                );


                try {

                  window.parent
                    .postMessage(

                      {
                        type: "barcode",
                        barcode: value
                      },

                      "*"

                    );

                }

                catch (e) {}


                resolve(true);

                return;

              }


            }

            catch (error) {


              console.log(
                name,
                error
              );

            }


            resolve(false);

          };


        img.onerror =
          function() {

            resolve(false);

          };


        img.src =
          dataUrl;


      }
    );


  }

  catch (error) {

    return false;

  }

}


/* =====================================================
   CAPTURE + PROCESS
   ===================================================== */

async function captureAndEnhance() {


  try {


    if (
      video.readyState < 2
    ) {


      setStatus(
        "❌ الكاميرا غير جاهزة."
      );


      return;

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {


      setStatus(
        "❌ لا توجد صورة من الكاميرا."
      );


      return;

    }


    /*
     * الصورة الأصلية
     */

    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(

      video,

      0,
      0,

      width,
      height

    );


    /*
     * عرض الصورة الأصلية
     */

    testImage.src =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    testImage.style.display =
      "block";


    setStatus(
      "🔎 جاري تجربة تحسين الصورة..."
    );


    setDebug(
      "Processing image...\n\n" +
      "Original: " +
      width +
      " x " +
      height
    );


    /*
     * المحاولة الأولى:
     * الصورة الأصلية
     */

    if (
      await tryDecodeCanvas(
        canvas,
        "Original"
      )
    ) {

      return;

    }


    /*
     * المحاولة الثانية:
     * تكبير 2x
     */

    setStatus(
      "🔎 تجربة تكبير 2×..."
    );


    const upscaled =
      createUpscaledImage(
        canvas,
        2
      );


    if (
      await tryDecodeCanvas(
        upscaled,
        "Upscale 2x"
      )
    ) {

      return;

    }


    /*
     * المحاولة الثالثة:
     * Grayscale + Contrast
     */

    setStatus(
      "🔎 تجربة Grayscale + Contrast..."
    );


    const enhanced =
      createEnhancedImage(
        upscaled
      );


    if (
      await tryDecodeCanvas(
        enhanced,
        "Grayscale + Contrast"
      )
    ) {

      return;

    }


    /*
     * المحاولة الرابعة:
     * Threshold
     */

    setStatus(
      "🔎 تجربة Black / White..."
    );


    const threshold =
      createThresholdImage(
        enhanced
      );


    if (
      await tryDecodeCanvas(
        threshold,
        "Threshold"
      )
    ) {

      return;

    }


    /*
     * لم ينجح
     */

    setStatus(
      "⚠️ لم يتم العثور على Barcode"
    );


    setDebug(

      "ALL METHODS FAILED\n\n" +

      "Original\n" +

      "Upscale 2x\n" +

      "Grayscale + Contrast\n" +

      "Threshold"

    );


  }

  catch (error) {


    console.error(error);


    setStatus(
      "❌ حدث خطأ أثناء معالجة الصورة"
    );


    setDebug(

      "ERROR:\n" +

      (
        error.message ||
        error
      )

    );

  }

}


/* =====================================================
   FILE IMAGE
   ===================================================== */

document

  .getElementById("fileBtn")

  .addEventListener(

    "click",

    () => {

      fileInput.click();

    }

  );


fileInput

  .addEventListener(

    "change",

    () => {


      const file =
        fileInput.files[0];


      if (!file) {

        return;

      }


      const url =
        URL.createObjectURL(
          file
        );


      const img =
        new Image();


      img.onload =
        async function() {


          testImage.src =
            url;


          testImage.style.display =
            "block";


          /*
           * Canvas للصورة المختارة
           */

          const c =
            document.createElement(
              "canvas"
            );


          c.width =
            img.naturalWidth;


          c.height =
            img.naturalHeight;


          const ctx =
            c.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0
          );


          setStatus(
            "🔎 فحص الصورة..."
          );


          /*
           * نفس سلسلة التحسين
           */

          if (
            await tryDecodeCanvas(
              c,
              "File Original"
            )
          ) {

            URL.revokeObjectURL(url);

            return;

          }


          const upscaled =
            createUpscaledImage(
              c,
              2
            );


          if (
            await tryDecodeCanvas(
              upscaled,
              "File Upscale 2x"
            )
          ) {

            URL.revokeObjectURL(url);

            return;

          }


          const enhanced =
            createEnhancedImage(
              upscaled
            );


          if (
            await tryDecodeCanvas(
              enhanced,
              "File Enhanced"
            )
          ) {

            URL.revokeObjectURL(url);

            return;

          }


          const threshold =
            createThresholdImage(
              enhanced
            );


          if (
            await tryDecodeCanvas(
              threshold,
              "File Threshold"
            )
          ) {

            URL.revokeObjectURL(url);

            return;

          }


          setStatus(
            "❌ لم يتم التعرف على Barcode"
          );


          setDebug(
            "ALL IMAGE METHODS FAILED"
          );


          URL.revokeObjectURL(url);


        };


      img.onerror =
        function() {


          setStatus(
            "❌ فشل تحميل الصورة"
          );


        };


      img.src =
        url;


    }

  );


/* =====================================================
   STOP
   ===================================================== */

function stopCamera(
  showMessage = true
) {


  scanning = false;


  try {

    if (controls) {

      controls.stop();

      controls = null;

    }

  }

  catch (e) {}


  try {

    if (codeReader) {

      codeReader.reset();

    }

  }

  catch (e) {}


  try {

    if (video.srcObject) {


      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      video.srcObject =
        null;

    }

  }

  catch (e) {}


  if (showMessage) {

    setStatus(
      "⏹ الكاميرا متوقفة"
    );

  }

}


/* =====================================================
   EVENTS
   ===================================================== */

document

  .getElementById("startBtn")

  .addEventListener(
    "click",
    startCamera
  );


document

  .getElementById("stopBtn")

  .addEventListener(
    "click",
    () => stopCamera(true)
  );


document

  .getElementById("mirrorBtn")

  .addEventListener(
    "click",
    mirrorCamera
  );


document

  .getElementById("normalBtn")

  .addEventListener(
    "click",
    normalCamera
  );


document

  .getElementById("captureBtn")

  .addEventListener(
    "click",
    captureAndEnhance
  );


/* =====================================================
   INITIALIZE
   ===================================================== */

updateMirror();


window.addEventListener(
  "load",
  () => {

    setTimeout(
      startCamera,
      500
    );

  }
);

</script>


</body>

</html>
