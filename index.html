<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Warehouse Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 5px 0 15px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: auto;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
    }

    video {
      width: 100%;
      height: auto;
      display: block;

      /* عكس الصورة للمستخدم */
      transform: scaleX(-1);
    }

    /* إطار القراءة */
    #scanFrame {
      position: absolute;
      left: 15%;
      right: 15%;
      top: 30%;
      height: 40%;

      border: 3px solid #00ff66;
      border-radius: 10px;

      pointer-events: none;
    }

    #scanLine {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;

      height: 2px;
      background: red;

      box-shadow: 0 0 8px red;

      animation: scanMove 2s infinite;
    }

    @keyframes scanMove {
      0% {
        top: 10%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 10%;
      }
    }

    .info {
      max-width: 900px;
      margin: 12px auto;
      padding: 12px;
      background: #222;
      border-radius: 10px;
      text-align: right;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      margin-top: 10px;
      padding: 12px;
      background: #000;
      border-radius: 8px;
      font-size: 20px;
      direction: ltr;
      text-align: center;
      word-break: break-all;
    }

    #debug {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #0a7cff;
      color: white;
    }

    #stopBtn {
      background: #d33;
      color: white;
    }

    #captureBtn {
      background: #16a34a;
      color: white;
    }

    canvas {
      display: none;
    }

    #capturedImage {
      display: none;
      width: 100%;
      max-width: 900px;
      margin: 15px auto;
      border-radius: 10px;
      border: 2px solid #555;
    }

    .small {
      color: #aaa;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <h2>📷 Barcode Scanner</h2>

  <div id="cameraBox">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div id="scanFrame">
      <div id="scanLine"></div>
    </div>

  </div>

  <div class="info">

    <div id="status">
      ⏳ جاري تشغيل الكاميرا...
    </div>

    <div class="small">
      وجّه الـ Barcode داخل الإطار الأخضر
    </div>

    <div id="result">
      لا يوجد Barcode
    </div>

    <div id="cameraInfo" class="small">
      -
    </div>

    <div id="debug">
      -
    </div>

  </div>

  <div>

    <button id="startBtn">
      ▶ تشغيل الكاميرا
    </button>

    <button id="captureBtn">
      📸 التقاط وفحص
    </button>

    <button id="stopBtn">
      ⏹ إيقاف
    </button>

  </div>

  <canvas id="canvas"></canvas>

  <img
    id="capturedImage"
    alt="Captured frame">

  <script>

    let codeReader = null;
    let controls = null;

    let video = null;
    let canvas = null;
    let capturedImage = null;

    let scanning = false;

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const cameraInfoEl = document.getElementById("cameraInfo");
    const debugEl = document.getElementById("debug");

    video = document.getElementById("video");
    canvas = document.getElementById("canvas");
    capturedImage = document.getElementById("capturedImage");


    function setStatus(text) {
      statusEl.textContent = text;
    }


    function setDebug(text) {
      debugEl.textContent = text;
    }


    function showResult(value, format) {

      resultEl.innerHTML =
        "✅ <b>" +
        escapeHtml(value) +
        "</b>" +
        (format
          ? "<br><small>Format: " +
            escapeHtml(String(format)) +
            "</small>"
          : "");

    }


    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function startCamera() {

      try {

        stopCamera();

        setStatus("⏳ جاري تشغيل الكاميرا...");

        resultEl.textContent = "لا يوجد Barcode";

        setDebug("Initializing ZXing...");

        if (
          typeof ZXingBrowser === "undefined"
        ) {

          throw new Error(
            "ZXingBrowser غير موجود. تأكد من تحميل مكتبة ZXing."
          );

        }


        codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();


        setDebug(
          "ZXing loaded.\n" +
          "Starting camera..."
        );


        const constraints = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920,
              min: 640
            },

            height: {
              ideal: 1080,
              min: 480
            },

            frameRate: {
              ideal: 30,
              min: 15
            }

          },

          audio: false

        };


        controls =
          await codeReader.decodeFromConstraints(

            constraints,

            video,

            (result, error, callbackControls) => {

              if (result) {

                const text =
                  result.getText();

                let format = "";

                try {

                  format =
                    result
                      .getBarcodeFormat()
                      .toString();

                } catch (e) {

                  format = "";

                }


                showResult(
                  text,
                  format
                );


                setStatus(
                  "✅ تم اكتشاف Barcode!"
                );


                setDebug(
                  "Barcode Found!\n" +
                  "Value: " +
                  text +
                  "\n" +
                  "Format: " +
                  format
                );


                /*
                 * إرسال القيمة إلى الصفحة الرئيسية
                 * لو الصفحة الرئيسية تستخدم postMessage
                 */
                try {

                  window.parent.postMessage(

                    {
                      type: "barcode",
                      barcode: text
                    },

                    "*"

                  );

                } catch (e) {}

              }

              else {

                if (scanning) {

                  setStatus(
                    "📷 الكاميرا تعمل. Scanning..."
                  );

                }

              }

            }

          );


        scanning = true;


        /*
         * معلومات الكاميرا
         */

        setTimeout(() => {

          try {

            const stream =
              video.srcObject;

            if (
              stream &&
              stream.getVideoTracks().length
            ) {

              const track =
                stream.getVideoTracks()[0];

              const settings =
                track.getSettings();

              cameraInfoEl.textContent =
                "الكاميرا: " +
                (track.label || "Unknown") +
                " | الدقة: " +
                (settings.width || "?") +
                " × " +
                (settings.height || "?");

              setDebug(
                "Scanning...\n\n" +
                "Camera: " +
                (track.label || "Unknown") +
                "\n" +
                "Resolution: " +
                (settings.width || "?") +
                " x " +
                (settings.height || "?") +
                "\n" +
                "Facing: " +
                (settings.facingMode || "unknown")
              );

            }

          } catch (e) {

            console.log(e);

          }

        }, 1000);


      } catch (error) {

        console.error(error);

        scanning = false;

        setStatus(
          "❌ فشل تشغيل الكاميرا"
        );

        setDebug(
          "ERROR:\n" +
          (error.message || error)
        );

      }

    }


    function captureAndDecode() {

      try {

        if (
          !video ||
          video.readyState < 2
        ) {

          setStatus(
            "❌ الكاميرا لم تصبح جاهزة بعد."
          );

          return;

        }


        const width =
          video.videoWidth;

        const height =
          video.videoHeight;


        if (!width || !height) {

          setStatus(
            "❌ لا توجد صورة من الكاميرا."
          );

          return;

        }


        canvas.width = width;
        canvas.height = height;


        const ctx =
          canvas.getContext("2d");


        /*
         * نأخذ الصورة الأصلية بدون Mirror
         * لأن ZXing يجب أن يفحص الصورة الأصلية.
         */

        ctx.drawImage(
          video,
          0,
          0,
          width,
          height
        );


        const imageData =
          canvas.toDataURL(
            "image/png"
          );


        capturedImage.src =
          imageData;

        capturedImage.style.display =
          "block";


        setStatus(
          "🔎 جاري فحص الصورة..."
        );


        setDebug(
          "Captured frame:\n" +
          width +
          " x " +
          height +
          "\nTrying ZXing decode..."
        );


        /*
         * إنشاء Image مؤقتة
         */

        const img =
          new Image();


        img.onload = async function() {

          try {

            const reader =
              new ZXingBrowser.BrowserMultiFormatReader();


            const result =
              await reader.decodeFromImageElement(
                img
              );


            if (result) {

              const value =
                result.getText();

              let format = "";

              try {

                format =
                  result
                    .getBarcodeFormat()
                    .toString();

              } catch (e) {}


              showResult(
                value,
                format
              );


              setStatus(
                "✅ تم اكتشاف Barcode من الصورة!"
              );


              setDebug(
                "IMAGE DECODE SUCCESS\n\n" +
                "Value: " +
                value +
                "\n" +
                "Format: " +
                format
              );


              try {

                window.parent.postMessage(

                  {
                    type: "barcode",
                    barcode: value
                  },

                  "*"

                );

              } catch (e) {}

            }

          } catch (error) {

            console.error(error);

            setStatus(
              "⚠️ الصورة اتصورت لكن لم يتم العثور على Barcode."
            );


            setDebug(
              "IMAGE DECODE FAILED\n\n" +
              (error.message || error)
            );

          }

        };


        img.onerror = function() {

          setStatus(
            "❌ فشل تحميل الصورة."
          );

        };


        img.src = imageData;


      } catch (error) {

        console.error(error);

        setStatus(
          "❌ حدث خطأ أثناء التقاط الصورة."
        );

        setDebug(
          "CAPTURE ERROR:\n" +
          (error.message || error)
        );

      }

    }


    function stopCamera() {

      scanning = false;


      try {

        if (controls) {

          controls.stop();
          controls = null;

        }

      } catch (e) {}


      try {

        if (codeReader) {

          codeReader.reset();

        }

      } catch (e) {}


      try {

        if (video.srcObject) {

          const tracks =
            video.srcObject.getTracks();

          tracks.forEach(
            track => track.stop()
          );

          video.srcObject = null;

        }

      } catch (e) {}


      setStatus(
        "⏹ الكاميرا متوقفة"
      );

    }


    document
      .getElementById("startBtn")
      .addEventListener(
        "click",
        startCamera
      );


    document
      .getElementById("stopBtn")
      .addEventListener(
        "click",
        stopCamera
      );


    document
      .getElementById("captureBtn")
      .addEventListener(
        "click",
        captureAndDecode
      );


    /*
     * تشغيل الكاميرا تلقائياً
     */

    window.addEventListener(
      "load",
      () => {

        setTimeout(
          startCamera,
          500
        );

      }
    );

  </script>

</body>
</html>
