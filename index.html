  <title>Warehouse Scanner</title>

  <!-- ZXing Barcode Scanner -->
 <script
   src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js">
   </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      background: #111827;
      color: white;

      font-family: Arial, sans-serif;

<body>
<h2 id="test">TEST</h2>

<script>
document.getElementById("test").textContent =
  "JavaScript يعمل بنجاح";
</script>
<div class="container">

  <h1>📷 Warehouse Scanner</h1>

  <div class="subtitle">
    امسح Barcode أو QR Code
  </div>


  <div id="status" class="status">

    اضغط "تشغيل الكاميرا" للبدء.

  </div>


  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

  </div>


  <div>

    <button id="startBtn">
      📷 تشغيل الكاميرا
    </button>

    <button id="stopBtn">
      ⛔ إيقاف
    </button>

  </div>


  <div
    id="result"
    class="result"
  >
    لم يتم قراءة Barcode بعد
  </div>


  <div class="info">

    وجّه الكاميرا إلى Barcode وانتظر حتى يتم التعرف عليه تلقائيًا.

  </div>

</div>


<script>

let codeReader = null;

let currentDeviceId = null;

let scanning = false;


const video =
  document.getElementById("video");


const statusBox =
  document.getElementById("status");


const resultBox =
  document.getElementById("result");


function setStatus(message, type = "") {

  statusBox.textContent = message;

  statusBox.className = "status";

  if (type === "success") {

    statusBox.classList.add("success");

  }

  if (type === "error") {

    statusBox.classList.add("error");

  }

}


async function startCamera() {

  try {

    stopCamera();

    setStatus(
      "جاري تشغيل الكاميرا..."
    );


    if (!window.isSecureContext) {

      throw new Error(
        "الصفحة ليست HTTPS."
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "المتصفح لا يدعم الوصول إلى الكاميرا."
      );

    }


    /*
      نطلب إذن الكاميرا أولًا
      حتى نضمن أن المتصفح يسمح بها.
    */

    const testStream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    testStream
      .getTracks()
      .forEach(track => track.stop());


    setStatus(
      "تم السماح بالكاميرا.\nجاري البحث عن الكاميرات..."
    );


    /*
      إنشاء قارئ ZXing
    */

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    /*
      الحصول على الكاميرات
    */

    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (!devices || devices.length === 0) {

      throw new Error(
        "لم يتم العثور على كاميرا."
      );

    }


    /*
      نحاول اختيار الكاميرا الخلفية
      إن كانت متاحة.
    */

    let selectedDevice =
      devices.find(device => {

        const label =
          (device.label || "").toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      });


    /*
      لو لم نجد كاميرا خلفية،
      نستخدم أول كاميرا.
    */

    if (!selectedDevice) {

      selectedDevice = devices[0];

    }


    currentDeviceId =
      selectedDevice.deviceId;


    setStatus(
      "📷 الكاميرا تعمل.\nوجّهها الآن إلى Barcode."
    );


    scanning = true;


    /*
      بدء القراءة المستمرة
    */

    await codeReader.decodeFromVideoDevice(

      currentDeviceId,

      video,

      (result, error) => {

        if (result) {

          handleBarcode(
            result.getText()
          );

        }

      }

    );


  } catch (error) {

    console.error(error);


    let message =
      "❌ فشل تشغيل الكاميرا.";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ تم رفض إذن الكاميرا.\n" +
        "اسمح للكاميرا لهذا الموقع من إعدادات Edge.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ لم يتم العثور على كاميرا.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ الكاميرا مستخدمة بواسطة برنامج آخر.";

    }


    else if (error.message) {

      message +=
        "\n" + error.message;

    }


    setStatus(
      message,
      "error"
    );

  }

}


function handleBarcode(value) {

  if (!value) {
    return;
  }


  /*
    منع تكرار القراءة
  */

  if (!scanning) {
    return;
  }


  scanning = false;


  resultBox.textContent =
    "✅ Barcode: " + value;


  resultBox.className =
    "result success";


  setStatus(
    "✅ تم قراءة Barcode بنجاح!",
    "success"
  );


  /*
    إيقاف الكاميرا بعد القراءة
  */

  stopCamera();


  /*
    نسخ النتيجة للحافظة
    لتسهيل الاختبار.
  */

  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(value)
      .catch(() => {});

  }

}


function stopCamera() {

  scanning = false;


  if (codeReader) {

    try {

      codeReader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  codeReader = null;

  currentDeviceId = null;


  /*
    إيقاف أي Stream موجود
  */

  if (video.srcObject) {

    const tracks =
      video.srcObject.getTracks();

    tracks.forEach(track => {
      track.stop();
    });

    video.srcObject = null;

  }

}


document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startCamera
  );


document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    () => {

      stopCamera();

      setStatus(
        "تم إيقاف الكاميرا."
      );

    }
  );


window.addEventListener(
  "beforeunload",
  () => {

    stopCamera();

  }
);

</script>

</body>

</html>
