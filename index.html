<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Warehouse Mobile Scanner
  </title>

  <script
    src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"
  ></script>

  <script>
    /* لو unpkg فشل نحمل من jsDelivr */
    if (typeof ZXingBrowser === "undefined") {
      document.write(
        '<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"><\/script>'
      );
    }
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background: #111827;

      color: white;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 600px;

      margin: auto;

      padding: 15px;

    }


    h1 {

      text-align: center;

      font-size: 24px;

      margin:
        10px 0
        15px;

    }


    .status {

      background: #1f2937;

      border-radius: 10px;

      padding: 12px;

      text-align: center;

      line-height: 1.6;

      margin-bottom: 12px;

    }


    .scanner-box {

      position: relative;

      width: 100%;

      background: black;

      border-radius: 15px;

      overflow: hidden;

    }


    video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 300px;

      object-fit: cover;

      background: black;

    }


    .scan-frame {

      position: absolute;

      left: 10%;

      right: 10%;

      top: 25%;

      height: 50%;

      border:

        3px solid
        rgba(255,255,255,.8);

      border-radius: 12px;

      pointer-events: none;

    }


    .scan-line {

      position: absolute;

      left: 12%;

      right: 12%;

      top: 50%;

      height: 3px;

      background: red;

      box-shadow:
        0 0 10px red;

      pointer-events: none;

    }


    .result {

      margin-top: 12px;

      background: #065f46;

      border-radius: 10px;

      padding: 15px;

      text-align: center;

      display: none;

    }


    .result.show {

      display: block;

    }


    .result-label {

      font-size: 13px;

      opacity: .9;

    }


    .result-value {

      font-size: 25px;

      font-weight: bold;

      margin-top: 6px;

      word-break: break-all;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 14px;

      margin-top: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .btn-primary {

      background: #2563eb;

      color: white;

    }


    .btn-light {

      background: #e5e7eb;

      color: #111827;

    }


    .btn-danger {

      background: #dc2626;

      color: white;

    }


    .info {

      margin-top: 12px;

      background: #1f2937;

      border-radius: 10px;

      padding: 12px;

      font-size: 13px;

      line-height: 1.8;

    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    📱 Warehouse Barcode Scanner <small style="font-size:12px;opacity:.6">v2</small>
  </h1>


  <div
    id="status"
    class="status"
  >
    جاري تجهيز Scanner...
  </div>


  <div class="scanner-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="scan-frame"></div>

    <div class="scan-line"></div>

  </div>


  <div
    id="result"
    class="result"
  >

    <div class="result-label">
      آخر Barcode
    </div>

    <div
      id="resultValue"
      class="result-value"
    >
      ---
    </div>

  </div>


  <button
    class="btn-primary"
    onclick="startScanner()"
  >
    📷 تشغيل / إعادة تشغيل الكاميرا
  </button>


  <button
    class="btn-light"
    onclick="switchCamera()"
  >
    🔄 تبديل الكاميرا
  </button>


  <button
    class="btn-light"
    onclick="handleBarcode('TEST-' + Date.now())"
  >
    🧪 إرسال باركود تجريبي
  </button>


  <button
    class="btn-danger"
    onclick="stopScanner()"
  >
    ⛔ إيقاف الكاميرا
  </button>


  <div class="info">

    <b>طريقة الاستخدام:</b>

    <br>

    1. افتح البرنامج على اللاب.

    <br>

    2. افتح هذه الصفحة على الموبايل.

    <br>

    3. اسمح للصفحة باستخدام الكاميرا.

    <br>

    4. وجّه Barcode داخل المربع.

    <br>

    5. عند القراءة سيتم إرسال الرقم للاب تلقائيًا.

  </div>

</div>


<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwD9w7udQcogxBpK0z69dTfs8CtSJz-fpa4JRbYUj_a3VtkmHGKaRd_va0rvIfXjaIRCw/exec";


  /* =========================================================
     GLOBAL
  ========================================================= */

  let codeReader = null;

  let currentStream = null;

  let scannerRunning = false;

  let cameras = [];

  let currentCameraIndex = 0;

  let lastScannedCode = "";

  let lastScanTime = 0;


  /* =========================================================
     DOM
  ========================================================= */

  const video =
    document.getElementById(
      "video"
    );


  const status =
    document.getElementById(
      "status"
    );


  const result =
    document.getElementById(
      "result"
    );


  const resultValue =
    document.getElementById(
      "resultValue"
    );


  /* =========================================================
     START
  ========================================================= */

  window.addEventListener(
    "load",
    function() {

      setTimeout(
        startScanner,
        500
      );

    }
  );


  /* =========================================================
     START SCANNER
  ========================================================= */

  async function startScanner() {

    try {

      scannerRunning = false;


      stopCurrentStream();


      status.textContent =
        "🔄 جاري تشغيل الكاميرا...";


      if (
        typeof ZXingBrowser ===
        "undefined"
      ) {

        throw new Error(
          "ZXingBrowser لم يتم تحميله."
        );

      }


      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      /*
        الحصول على الكاميرات
      */

      cameras =
        await ZXingBrowser.BrowserCodeReader
          .listVideoInputDevices();


      if (
        !cameras ||
        !cameras.length
      ) {

        throw new Error(
          "لم يتم العثور على كاميرا."
        );

      }


      /*
        نختار الكاميرا الخلفية
        إن أمكن.
      */

      let selectedCamera =
        cameras.find(
          function(camera) {

            const label =
              String(
                camera.label || ""
              ).toLowerCase();


            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment") ||
              label.includes("خلف")
            );

          }
        );


      if (!selectedCamera) {

        selectedCamera =
          cameras[
            currentCameraIndex %
            cameras.length
          ];

      }


      currentCameraIndex =
        cameras.indexOf(
          selectedCamera
        );


      status.textContent =
        "📷 جاري تشغيل الكاميرا...";


      scannerRunning = true;


      /*
        ZXing يبدأ القراءة
      */

      await codeReader.decodeFromVideoDevice(

        selectedCamera.deviceId,

        video,

        function(
          resultCode,
          error
        ) {

          if (!scannerRunning) {
            return;
          }


          if (resultCode) {

            const text =
              resultCode.getText();


            if (text) {

              handleBarcode(
                text
              );

            }

          }

        }

      );


      status.textContent =
        "🟢 الكاميرا تعمل. وجّه Barcode إلى المربع.";


    } catch (error) {

      console.error(
        error
      );


      scannerRunning = false;


      status.textContent =
        "❌ تعذر تشغيل الكاميرا: " +
        (
          error.message ||
          error
        );

    }

  }


  /* =========================================================
     BARCODE RECEIVED
  ========================================================= */

  async function handleBarcode(
    barcode
  ) {

    barcode =
      String(
        barcode || ""
      ).trim();


    if (!barcode) {
      return;
    }


    /*
      منع تكرار نفس Barcode
      عدة مرات في نفس اللحظة.
    */

    const now =
      Date.now();


    if (
      barcode ===
      lastScannedCode &&
      now - lastScanTime < 2000
    ) {

      return;

    }


    lastScannedCode =
      barcode;


    lastScanTime =
      now;


    resultValue.textContent =
      barcode;


    result.classList.add(
      "show"
    );


    status.textContent =
      "📤 تم قراءة Barcode: " +
      barcode +
      " — جاري إرساله للاب...";


    /*
      إرسال إلى Google Apps Script
    */

    sendBarcodeToLaptop(
      barcode
    );

  }


  /* =========================================================
     SEND BARCODE
  ========================================================= */

  const SCANNER_TOKEN = "";


  async function sendBarcodeToLaptop(barcode) {

    barcode =
      String(
        barcode || ""
      ).trim();


    if (!barcode) {
      return;
    }


    const separator =
      GOOGLE_SCRIPT_URL.includes("?")
        ? "&"
        : "?";


    let url =
      GOOGLE_SCRIPT_URL +
      separator +
      "action=scan" +
      "&barcode=" +
      encodeURIComponent(
        barcode
      ) +
      "&t=" +
      Date.now();


    if (SCANNER_TOKEN) {

      url +=
        "&token=" +
        encodeURIComponent(
          SCANNER_TOKEN
        );

    }


    status.textContent =
      "📤 جاري إرسال Barcode للاب...";


    /*
      طلب واحد فقط (fetch بدون CORS).
      كان الكود القديم يرسل 3 طلبات
      (fetch + iframe + image) فيتسجل
      الباركود 3 مرات في الشيت.
    */

    try {

      await fetch(url, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        credentials: "omit"
      });

      status.textContent =
        "✅ تم إرسال Barcode للاب: " +
        barcode;

    } catch (error) {

      console.error(
        "fetch send error:",
        error
      );

      status.textContent =
        "❌ فشل إرسال Barcode للاب — تأكد من الإنترنت";

    }

  }


  /* =========================================================
     SWITCH CAMERA
  ========================================================= */

  async function switchCamera() {

    if (
      !cameras ||
      cameras.length < 2
    ) {

      status.textContent =
        "⚠️ لا توجد كاميرا أخرى متاحة.";

      return;

    }


    currentCameraIndex =
      (
        currentCameraIndex +
        1
      ) %
      cameras.length;


    const camera =
      cameras[
        currentCameraIndex
      ];


    status.textContent =
      "🔄 جاري تبديل الكاميرا...";


    try {

      scannerRunning = false;


      stopCurrentStream();


      if (codeReader) {

        try {

          codeReader.reset();

        } catch (e) {}

      }


      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      scannerRunning = true;


      await codeReader.decodeFromVideoDevice(

        camera.deviceId,

        video,

        function(
          resultCode,
          error
        ) {

          if (!scannerRunning) {
            return;
          }


          if (resultCode) {

            const text =
              resultCode.getText();


            if (text) {

              handleBarcode(
                text
              );

            }

          }

        }

      );


      status.textContent =
        "🟢 تم تبديل الكاميرا.";

    } catch (error) {

      console.error(
        error
      );


      status.textContent =
        "❌ تعذر تبديل الكاميرا.";

    }

  }


  /* =========================================================
     STOP
  ========================================================= */

  function stopScanner() {

    scannerRunning =
      false;


    if (codeReader) {

      try {

        codeReader.reset();

      } catch (e) {}

    }


    stopCurrentStream();


    status.textContent =
      "⛔ تم إيقاف الكاميرا.";

  }


  /* =========================================================
     STOP STREAM
  ========================================================= */

  function stopCurrentStream() {

    if (
      currentStream
    ) {

      currentStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      currentStream =
        null;

    }


    if (
      video.srcObject
    ) {

      const tracks =
        video.srcObject
          .getTracks();


      tracks.forEach(
        function(track) {

          track.stop();

        }
      );


      video.srcObject =
        null;

    }

  }

</script>

</body>

</html>
